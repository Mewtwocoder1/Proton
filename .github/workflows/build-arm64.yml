name: Build ARM64 Proton

on:
  workflow_dispatch:
  push:
    branches:
      - proton-11.0-1

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Fetches full history & tags to prevent git describe errors

      - name: Fetch all submodule tags
        run: git submodule foreach --recursive 'git fetch --tags || true'

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Configure and Build Proton ARM64
        run: |
          mkdir build
          cd build
          ../configure.sh --target-arch=arm64
          make redist

      - name: Upload Proton Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proton-11.0-1-LinUwUx-ARM64
          path: build/dist/
